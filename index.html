
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dukan Hisab Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Dukan Hisab Pro</h1>
    <p>Smart Shop Management System</p>
  </header>

  <main>
    <section class="card">
      <h2>Shop Dashboard</h2>
      <p>Welcome, Shopkeeper!</p>
    </section>

    <section class="card">
      <h3>Today's Sales</h3>
      <h2 id="sales">Rs. 0</h2>
    </section>

    <section class="card">
      <h3>Today's Expenses</h3>
      <h2 id="expenses">Rs. 0</h2>
    </section>

    <section class="card">
      <h3>Customer Udhaar</h3>
      <h2 id="udhaar">Rs. 0</h2>
    </section>

    <section class="card">
      <h2>Add New Sale</h2>
      <input type="number" id="saleAmount"
        placeholder="Enter sale amount">
      <button onclick="addSale()">Save Sale</button>
    </section>

    <section class="card">
      <h2>Add Expense</h2>
      <input type="number" id="expenseAmount"
        placeholder="Enter expense amount">
      <button onclick="addExpense()">Save Expense</button>
    </section>

    <section class="card">
      <h2>Add Customer Udhaar</h2>
      <input type="number" id="udhaarAmount"
        placeholder="Enter udhaar amount">
      <button onclick="addUdhaar()">Save Udhaar</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

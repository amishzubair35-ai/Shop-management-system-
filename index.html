
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dukan Hisab Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 20px;
    }
    .header {
      background: #123b32;
      color: white;
      padding: 22px;
      border-radius: 12px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }
    h2 { color: #123b32; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dukan Hisab Pro</h1>
    <p>Apni dukaan ka complete hisaab</p>
  </div>

  <div class="card">
    <h2>Welcome, Shopkeeper!</h2>
    <p>Manage your shop easily.</p>
  </div>

  <div class="card">
    <h2>Today's Sales</h2>
    <h2>Rs. 0</h2>
  </div>

  <div class="card">
    <h2>Expenses</h2>
    <h2>Rs. 0</h2>
  </div>

  <div class="card">
    <h2>Customer Udhaar</h2>
    <h2>Rs. 0</h2>
  </div>
</body>
</html>
